name: Infra CI/CD (OpenTofu + Floci)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TOFU_VERSION: "1.10.6"
  AWS_DEFAULT_REGION: "us-east-1"
  FLOCI_ENDPOINT: "http://localhost:4566"

jobs:
  # ============================================================================
  # 1. Formatação e Validação Estática (floci-local e aws-prod)
  # ============================================================================
  validate:
    name: Format & Validate (OpenTofu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Verificar formatação HCL (tofu fmt -check)
        run: tofu fmt -check -recursive .

      - name: Validar ambiente floci-local (sem backend)
        working-directory: environments/floci-local
        run: |
          tofu init -backend=false -input=false -no-color
          tofu validate -no-color

      - name: Validar ambiente aws-prod (sem backend)
        working-directory: environments/aws-prod
        run: |
          tofu init -backend=false -input=false -no-color
          tofu validate -no-color

  # ============================================================================
  # 2. Scan de Segredos (Garante ZERO chaves de acesso estáticas no repositório)
  # ============================================================================
  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (histórico completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  # ============================================================================
  # 3. Segurança IaC (Trivy Config)
  # ============================================================================
  security:
    name: IaC Security Scan (Trivy Config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy Config (bloqueia misconfigurations CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  # ============================================================================
  # 4. E2E no Floci: Bootstrap S3 -> Init -> Plan (PR Comment) -> Apply ->
  #    Smoke Test -> OIDC AssumeRoleWithWebIdentity -> Destroy do zero!
  # ============================================================================
  floci-e2e:
    name: E2E Apply, OIDC & Destroy (Floci)
    needs: [validate, secrets, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Comenta o resultado do `tofu plan` no PR
      id-token: write      # Permissão OIDC nativa do GitHub Actions
    env:
      AWS_ACCESS_KEY_ID: floci-ephemeral
      AWS_SECRET_ACCESS_KEY: floci-ephemeral
      TF_VAR_floci_endpoint: "http://localhost:4566"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gerar senha efêmera por execução para o RDS (zero senhas fixas)
        run: |
          DB_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::${DB_PASS}"
          echo "TF_VAR_db_password=${DB_PASS}" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Subir emulador AWS local Floci
        run: |
          docker compose up -d --wait
          docker compose ps

      - name: Bootstrap do Bucket S3 de State (use_lockfile = true)
        run: ./scripts/bootstrap-state.sh

      - name: OpenTofu Init (Backend S3 + Lock Nativo .tflock)
        working-directory: environments/floci-local
        run: |
          tofu init -backend-config=backend.hcl \
            -backend-config="endpoint=${FLOCI_ENDPOINT}" \
            -input=false -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: environments/floci-local
        run: |
          tofu plan -input=false -no-color -out=tfplan | tee /tmp/tofu_plan.txt
          SUMMARY=$(grep -E '^Plan:' /tmp/tofu_plan.txt || echo "Plan gerado com sucesso")
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Comentar Plan e Estimativa FinOps no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const planText = fs.readFileSync('/tmp/tofu_plan.txt', 'utf8');
            const maxLen = 55000;
            const truncatedPlan = planText.length > maxLen
              ? planText.slice(-maxLen) + '\n... (truncado)'
              : planText;
            const summary = process.env.PLAN_SUMMARY || 'Plan gerado com sucesso';
            const marker = '<!-- opentofu-floci-plan-comment -->';

            const body = [
              marker,
              '## 🏗️ OpenTofu Plan & FinOps Report (Emulado via Floci)',
              '',
              '| Validação | Status | Detalhe |',
              '|---|---|---|',
              '| **Formatação (`tofu fmt`)** | ✅ Passou | Padrão canônico HCL |',
              '| **Validação (`tofu validate`)** | ✅ Passou | `floci-local` & `aws-prod` válidos |',
              '| **Segurança IaC (`trivy config`)** | ✅ Passou | `0 CRITICAL / 0 HIGH` |',
              '| **Chaves Estáticas (`gitleaks`)** | ✅ Zero Chaves | Federação via **OIDC (`sts:AssumeRoleWithWebIdentity`)** |',
              '| **Backend State S3** | ✅ Lock Nativo | `use_lockfile = true` (`.tflock` no S3, sem DynamoDB) |',
              '| **Resumo do Plano** | ✅ Pronto | `' + summary + '` |',
              '',
              '### 💰 Estimativa FinOps: Custo na AWS Real (`us-east-1`) vs. Floci',
              '',
              '| Recurso | Especificação Econômica | Custo/Hora (AWS) | Custo/Mês (730h AWS) | No Floci (Local/CI) |',
              '|---|---|---:|---:|---:|',
              '| **VPC + 2 Subnets Públicas + IGW + 3 SGs** | Sem NAT Gateway (economia de US$ 32,85/mês) | US$ 0,0000 | US$ 0,00 | **US$ 0,00** |',
              '| **Auto Scaling (1x EC2 `t3.micro` + IPv4) + EBS 20 GB gp3** | 2 vCPU, 1 GiB RAM, IMDSv2 + KMS | US$ 0,0176 | US$ 12,84 | **US$ 0,00** |',
              '| **Application Load Balancer (ALB)** | Apenas durante os testes (base + LCU + IPv4) | US$ 0,0405 | US$ 29,56 | **US$ 0,00** |',
              '| **RDS PostgreSQL 17 Single-AZ (`db.t4g.micro`) + 20 GB** | Sem Multi-AZ (economia de 50%) | US$ 0,0192 | US$ 13,98 | **US$ 0,00** |',
              '| **S3 + KMS + Secrets Manager + Budgets + CloudWatch** | 1 KMS CMK + 1 Secret + S3 (<5 GB) + 1 Alarm | US$ 0,0022 | US$ 1,62 | **US$ 0,00** |',
              '| **Total (Stack Completa Ativa)** | **37 recursos gerenciados** | **US$ 0,0795/h** | **US$ 58,00/mês** | **US$ 0,00** |',
              '',
              '<details>',
              '<summary>📋 <strong>Clique para expandir a saída completa do <code>tofu plan</code></strong></summary>',
              '',
              '```hcl',
              truncatedPlan,
              '```',
              '',
              '</details>'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: OpenTofu Apply (Provisionar 37 recursos do zero no Floci)
        working-directory: environments/floci-local
        run: tofu apply -input=false -auto-approve -no-color tfplan

      - name: Smoke Test da Infraestrutura (AWS CLI contra Floci)
        run: ./scripts/smoke-infra.sh

      - name: Validar Autenticação OIDC (AssumeRoleWithWebIdentity sem chaves estáticas)
        run: ./scripts/verify-oidc.sh

      - name: OpenTofu Destroy (Derrubar toda a infraestrutura ao final)
        working-directory: environments/floci-local
        run: tofu destroy -input=false -auto-approve -no-color

      - name: Logs do Floci (em caso de falha)
        if: failure()
        run: docker compose logs

      - name: Derrubar container Floci
        if: always()
        run: docker compose down -v

  # ============================================================================
  # 5. Ciclo Real na AWS via OIDC (Orçamento/Alarmes -> Apply -> Smoke -> Destroy)
  #    Ativado quando vars.AWS_PROD_ENABLED == 'true' e AWS_OIDC_ROLE_ARN configurado
  # ============================================================================
  aws-prod-oidc:
    name: Deploy & Destroy AWS Real (OIDC Keyless)
    needs: [floci-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write # Obrigatório para solicitar JWT OIDC real ao provedor do GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gerar senha efêmera por execução para o RDS
        run: |
          DB_PASS="$(openssl rand -hex 20)"
          echo "::add-mask::${DB_PASS}"
          echo "TF_VAR_db_password=${DB_PASS}" >> "$GITHUB_ENV"

      - name: Autenticar na AWS Real via OIDC (Sem chaves estáticas e sem JWT sintético)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Confirmar identidade OIDC assumida na AWS Real
        run: aws sts get-caller-identity

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: OpenTofu Init, Apply (com Budgets + Alarmes) e Destroy na AWS Real
        working-directory: environments/aws-prod
        run: |
          tofu init -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=aws-prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_DEFAULT_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false -no-color
          tofu plan -input=false -no-color -out=tfplan
          tofu apply -input=false -auto-approve -no-color tfplan
          tofu destroy -input=false -auto-approve -no-color
