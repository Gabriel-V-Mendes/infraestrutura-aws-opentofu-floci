# Emulador AWS local open-source (Floci - https://github.com/floci-io/floci)
# Adotado para validação local e em CI sem exigir LOCALSTACK_AUTH_TOKEN (obrigatório na imagem unificada do LocalStack desde a release 2026.03.0):
# - Sem conta AWS, sem auth token, sem feature gates (licença MIT)
# - Medição local (floci/floci:2.3.0): boot do processo nativo Quarkus 3.40.1/GraalVM em 0.673s (docker logs) e ~39.11 MiB de RAM ociosa (docker stats --no-stream)
# - Healthcheck HTTP em: http://localhost:4566/_floci/health
name: floci-aws-emulator

services:
  floci:
    image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
    environment:
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-memory}
      FLOCI_SERVICES_EC2_MOCK: ${FLOCI_SERVICES_EC2_MOCK:-true}
      FLOCI_SERVICES_EC2_MOCK_PUBLIC_ADDRESSES: ${FLOCI_SERVICES_EC2_MOCK_PUBLIC_ADDRESSES:-fixed}
      FLOCI_SERVICES_EC2_VPC_NETWORKS_ENABLED: ${FLOCI_SERVICES_EC2_VPC_NETWORKS_ENABLED:-false}
      FLOCI_SERVICES_RDS_MOCK: ${FLOCI_SERVICES_RDS_MOCK:-true}
    volumes:
      - floci_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  floci_data:
